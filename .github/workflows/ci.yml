name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panparrot
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: panparrot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panparrot -d panparrot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://panparrot:local-dev-only@127.0.0.1:5432/panparrot
      SESSION_SECRET: ci-session-secret-should-be-32chars
      AUTH_DEV_EXPOSE_CODE: "true"
      SITE_URL: http://127.0.0.1:8080
      ADMIN_EMAILS: ashamah@paloaltonetworks.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m pip install --disable-pip-version-check --break-system-packages boto3
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:local
      - run: npm run typecheck
      - run: npm test
      - name: Checkout demisto/content
        uses: actions/checkout@v4
        with:
          repository: demisto/content
          ref: ff4a8f7ee870499a73807b538cdbf42ee9f6c8f1
          path: content
          fetch-depth: 1
          sparse-checkout: |
            Packs/*/Integrations
            Packs/ApiModules/Scripts
          sparse-checkout-cone-mode: false
      - name: Cross-check verified presets
        run: python3 scripts/crosscheck_presets.py --content content --strict
      - run: npm run build
      - name: Bundle Netlify functions and edge functions
        run: npx --yes netlify-cli@23.15.1 build --offline
      - run: npm run test:e2e
