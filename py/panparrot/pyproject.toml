[project]
name = "panparrot"
version = "0.1.0"
description = "Create PAN Parrot mocks and configure an XSIAM integration instance."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
panparrot = "panparrot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
